services:
  web-dev:
    build:
      context: .
      target: development
    container_name: recipe-analyzer-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_HOST=host.docker.internal
      - NEXT_PUBLIC_API_PORT=8002
      - PATH=/app/node_modules/.bin:$PATH
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web-prod:
    build:
      context: .
      target: production
    container_name: recipe-analyzer-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_HOST=host.docker.internal
      - NEXT_PUBLIC_API_PORT=8002
    extra_hosts:
      - "host.docker.internal:host-gateway"